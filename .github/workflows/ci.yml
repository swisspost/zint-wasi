name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Only the latest push to a branch is worth a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  XTASK_WASI_SDK_VERSION: 24
  XTASK_BINARYEN_VERSION: 119
  XTASK_TYPST_VERSION: 0.13.1
  XTASK_WORK_DIR: ./ci_work_dir

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
            submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
            components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The crates are listed explicitly because the workspace also contains
      # vendored third-party code that is not ours to format or lint.
      - name: Check formatting
        run: cargo fmt --check -p zint-wasm-sys -p zint-wasm-rs -p zint-typst-plugin -p xtask
      - name: Check lints
        run: cargo clippy --all-targets -p zint-wasm-sys -p zint-wasm-rs -p zint-typst-plugin -p xtask -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
            submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test

  plugin:
    name: Build Typst Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
            submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
            targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Restore WASI SDK
        uses: actions/cache/restore@v6
        with:
          path: ci_work_dir/wasi_sdk
          key: tools-wasi-sdk-${{ env.XTASK_WASI_SDK_VERSION }}
      - name: Restore wasi-stub
        uses: actions/cache/restore@v6
        with:
          path: |
            zint-typst-plugin/vendor/wasm-minimal-protocol/target/release/wasi-stub
            zint-typst-plugin/vendor/wasm-minimal-protocol/target/debug/wasi-stub
          key: tools-wasi-stub-${{ hashFiles('zint-typst-plugin/vendor/wasm-minimal-protocol/crates/wasi-stub/**') }}
      - name: Restore wasm-opt
        uses: actions/cache/restore@v6
        with:
          path: ci_work_dir/tools/wasm-opt
          key: tools-binaryen-${{ env.XTASK_BINARYEN_VERSION }}
      - name: Restore typst
        uses: actions/cache/restore@v6
        with:
          path: ci_work_dir/tools/typst
          key: tools-typst-${{ env.XTASK_TYPST_VERSION }}
      - name: Run CI xtask
        run: cargo xtask ci
      - name: Cache WASI SDK
        uses: actions/cache/save@v6
        with:
          path: ci_work_dir/wasi_sdk
          key: tools-wasi-sdk-${{ env.XTASK_WASI_SDK_VERSION }}
      - name: Cache wasi-stub
        uses: actions/cache/save@v6
        with:
          path: |
            zint-typst-plugin/vendor/wasm-minimal-protocol/target/release/wasi-stub
            zint-typst-plugin/vendor/wasm-minimal-protocol/target/debug/wasi-stub
          key: tools-wasi-stub-${{ hashFiles('zint-typst-plugin/vendor/wasm-minimal-protocol/crates/wasi-stub/**') }}
      - name: Cache wasm-opt
        uses: actions/cache/save@v6
        with:
          path: ci_work_dir/tools/wasm-opt
          key: tools-binaryen-${{ env.XTASK_BINARYEN_VERSION }}
      - name: Cache typst
        uses: actions/cache/save@v6
        with:
          path: ci_work_dir/tools/typst
          key: tools-typst-${{ env.XTASK_TYPST_VERSION }}
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-wasm
          path: ./typst-package/zint_typst_plugin.wasm
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: manual
          path: ./typst-package/manual.pdf
          retention-days: 7
